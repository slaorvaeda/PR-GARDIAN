name: PR-Guardian CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-ai-engine:
    name: Test AI Engine (Python 3.13 + LangGraph)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'ai-engine/requirements.txt'

      - name: Install AI Engine Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-engine/requirements.txt

      - name: Run End-to-End Multi-Agent Validation Test
        run: |
          cd ai-engine
          python test_ai_engine.py

  test-backend:
    name: Verify Node.js Backend Gateway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package.json'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Check Backend Syntax & Structure
        run: |
          cd backend
          node --check src/server.js
          node --check src/services/queue.js
          node --check src/services/diffParser.js
          node --check src/services/github.js

  build-frontend:
    name: Build React + Vite Production Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Vite Bundle
        run: |
          cd frontend
          npm run build
