name: Docker Build & Compose Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-docker:
    name: Validate Dockerfiles & Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build AI Engine Image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-engine
          push: false
          tags: pr-guardian-ai-engine:test

      - name: Build Backend Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: pr-guardian-backend:test

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: pr-guardian-frontend:test
