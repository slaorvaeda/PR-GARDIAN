name: PR-Guardian Autonomous Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  audit-pull-request:
    name: Autonomous Codebase & Security Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'ai-engine/requirements.txt'

      - name: Install AI Engine Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-engine/requirements.txt

      - name: Extract Pull Request Unified Diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff
          echo "Generated diff size: $(wc -l < pr.diff) lines"

      - name: Execute Multi-Agent Audit (AST + Security + Architecture + Critic)
        run: |
          python scripts/ci_reviewer.py pr.diff

      - name: Post PR-Guardian Review to GitHub Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (fs.existsSync('review_summary.md')) {
              const body = fs.readFileSync('review_summary.md', 'utf8');
              
              // Post review comment on the PR
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
              console.log('Posted review summary to PR #' + context.issue.number);
            }
